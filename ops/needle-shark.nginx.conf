limit_req_zone $binary_remote_addr zone=needle_leads:1m rate=10r/m;
server {
    server_name needle-shark.ru;
    root /var/www/needle-shark/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/snippets/needle-shark-leads.conf;
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(html|css|js|svg|png)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/needleshark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/needleshark.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name needleshark.ru www.needleshark.ru www.needle-shark.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/needleshark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/needleshark.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Keep submissions from already-open pages working during the transition.
    include /etc/nginx/snippets/needle-shark-leads.conf;
    location / { return 301 https://needle-shark.ru$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name needle-shark.ru www.needle-shark.ru needleshark.ru www.needleshark.ru;
    return 301 https://needle-shark.ru$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
