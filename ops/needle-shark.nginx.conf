limit_req_zone $binary_remote_addr zone=needle_leads:1m rate=10r/m;
server {
    server_name needleshark.ru www.needleshark.ru 194.87.99.98;
    root /var/www/needle-shark/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /api/leads {
        limit_except POST { deny all; }
        limit_req zone=needle_leads burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(html|css|js|svg|png)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/needleshark.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/needleshark.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.needleshark.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = needleshark.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name needleshark.ru www.needleshark.ru 194.87.99.98;
    return 404; # managed by Certbot




}